apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu
  template:
    metadata:
      labels:
        app: cpu
    spec:
      containers:
        - name: cpu
          image: juliadsleal/poi-cpu:latest
          ports:
            - containerPort: 8001
